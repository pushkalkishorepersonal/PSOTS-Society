<!DOCTYPE html>
<html>
<head>
  <title>Check Database - PSOTS</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; }
    h1 { color: #1a4a3a; }
    .summary { background: #f0f9ff; padding: 20px; border-radius: 8px; margin: 20px 0; }
    .summary h3 { margin-top: 0; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
    th { background: #1a4a3a; color: white; }
    .status-pending { color: #f59e0b; font-weight: 600; }
    .status-approved { color: #22c55e; font-weight: 600; }
    .status-rejected { color: #ef4444; font-weight: 600; }
    .status-verified_owner { color: #3b82f6; font-weight: 600; }
    button { background: #1a4a3a; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 16px; }
    #loading { display: none; margin: 20px 0; }
  </style>
</head>
<body>
  <h1>📊 Database Status</h1>
  <button onclick="loadData()">🔄 Check Database</button>
  <div id="loading">Loading...</div>
  <div id="summary"></div>
  <div id="residents"></div>
  <div id="credentials"></div>

  <script type="module">
    import { auth } from './js/core/firebase.js';
    import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';

    const WORKER_URL = 'https://telegram.psots.in';
    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        loadData();
      }
    });

    window.loadData = async function() {
      if (!currentUser) {
        alert('Please sign in first (go to login page)');
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('summary').innerHTML = '';
      document.getElementById('residents').innerHTML = '';
      document.getElementById('credentials').innerHTML = '';

      try {
        const token = await currentUser.getIdToken();
        const response = await fetch(`${WORKER_URL}/admin/list-data`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        const data = await response.json();
        
        if (!data.ok) {
          throw new Error(data.error);
        }

        // Summary
        const summaryHtml = `
          <div class="summary">
            <h3>📊 Summary</h3>
            <p><strong>Total Residents:</strong> ${data.summary.totalResidents}</p>
            <p><strong>Total Credentials:</strong> ${data.summary.totalCredentials}</p>
            <hr>
            <p><strong>By Status:</strong></p>
            <ul>
              <li>Pending: ${data.summary.byStatus.pending}</li>
              <li>Approved: ${data.summary.byStatus.approved}</li>
              <li>Rejected: ${data.summary.byStatus.rejected}</li>
              <li>Verified Owner: ${data.summary.byStatus.verified_owner}</li>
              <li>Other: ${data.summary.byStatus.other}</li>
            </ul>
          </div>
        `;
        document.getElementById('summary').innerHTML = summaryHtml;

        // Residents table
        if (data.residents.length > 0) {
          const residentsHtml = `
            <h3>👥 Residents (${data.residents.length})</h3>
            <table>
              <thead>
                <tr>
                  <th>Name</th>
                  <th>Flat</th>
                  <th>Status</th>
                  <th>Type</th>
                  <th>Created</th>
                </tr>
              </thead>
              <tbody>
                ${data.residents.map(r => `
                  <tr>
                    <td>${r.name || 'N/A'}</td>
                    <td>${r.flatNumber || 'N/A'}</td>
                    <td class="status-${r.status}">${r.status || 'N/A'}</td>
                    <td>${r.residentType || 'owner'}</td>
                    <td>${r.createdAt ? new Date(r.createdAt).toLocaleDateString() : 'N/A'}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
          document.getElementById('residents').innerHTML = residentsHtml;
        }

        // Credentials table
        if (data.credentials.length > 0) {
          const credentialsHtml = `
            <h3>🔑 Credentials (${data.credentials.length})</h3>
            <table>
              <thead>
                <tr>
                  <th>Identifier</th>
                  <th>Type</th>
                  <th>Resident ID</th>
                </tr>
              </thead>
              <tbody>
                ${data.credentials.map(c => `
                  <tr>
                    <td>${c.identifier || 'N/A'}</td>
                    <td>${c.type || 'N/A'}</td>
                    <td><code>${c.residentId || 'N/A'}</code></td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `;
          document.getElementById('credentials').innerHTML = credentialsHtml;
        }

      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        document.getElementById('loading').style.display = 'none';
      }
    };
  </script>
</body>
</html>
