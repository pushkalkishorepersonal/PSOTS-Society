<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signing in...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1a4a3a 0%, #2d6b57 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      text-align: center;
      color: white;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top: 4px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h1 {
      font-size: 20px;
      margin-bottom: 8px;
      font-weight: 600;
    }
    p {
      font-size: 14px;
      opacity: 0.9;
    }
    .error {
      background: rgba(255, 67, 67, 0.1);
      border: 1px solid rgba(255, 67, 67, 0.3);
      color: #ff6b6b;
      padding: 16px;
      border-radius: 8px;
      margin-top: 20px;
      display: none;
      text-align: left;
    }
    .error code {
      background: rgba(0, 0, 0, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="spinner"></div>
    <h1>Signing in to PSOTS...</h1>
    <p>One moment while we verify your account</p>
    <div class="error" id="errorBox"></div>
  </div>

  <script>
    // Google OAuth callback handler
    // Google redirects here with ?code=... after user signs in
    // We simply forward to the Worker for exchange + session creation

    function handleCallback() {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDesc = params.get('error_description');

      if (error) {
        const redirectUrl = `https://society.psots.in/society/login.html?oauth_error=${encodeURIComponent(error)}`;
        window.location.href = redirectUrl;
        return;
      }

      if (!code) {
        window.location.href = 'https://society.psots.in/society/login.html?oauth_error=no_code';
        return;
      }

      // Redirect to Worker for token exchange + session
      // The Worker will verify with Google, create a session cookie, and redirect back
      const workerUrl = `https://telegram.psots.in/auth/google/callback?code=${encodeURIComponent(code)}&state=${encodeURIComponent(state || '')}`;
      window.location.href = workerUrl;
    }

    function showError(title, detail) {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('h1').textContent = 'Sign-in failed';
      document.querySelector('p').textContent = title;
      const errorBox = document.getElementById('errorBox');
      errorBox.innerHTML = detail ? `<p><code>${detail}</code></p>` : '';
      errorBox.style.display = 'block';
    }

    // Process the callback immediately
    handleCallback();
  </script>
</body>
</html>
