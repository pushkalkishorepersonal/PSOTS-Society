<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Check & Approve Status</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    body {
      font-family: 'Monaco', 'Courier New', monospace;
      max-width: 800px;
      margin: 50px auto;
      padding: 30px;
      background: #1a1a1a;
      color: #00ff00;
      line-height: 1.6;
    }
    h1 {
      color: #00ffff;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
    }
    pre {
      background: #000;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #00ff00;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    button {
      padding: 20px 40px;
      font-size: 18px;
      font-weight: bold;
      background: #00ff00;
      color: #000;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
      font-family: inherit;
    }
    button:hover {
      background: #00ffff;
    }
    button:disabled {
      background: #666;
      cursor: not-allowed;
    }
    .error { color: #ff0000; }
    .success { color: #00ff00; }
    .warning { color: #ffff00; }
  </style>
</head>
<body>
  <h1>🔍 PSOTS Status Checker & Auto-Approver</h1>
  <pre id="output">Initializing Firebase...</pre>
  <button id="approve" style="display:none;">✅ APPROVE MYSELF NOW</button>
  
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBYond4wP2kP6R8Y5h6vbO_jBe8Q7dpXCc",
      authDomain: "psots-society.firebaseapp.com",
      projectId: "psots-society",
      storageBucket: "psots-society.firebasestorage.app",
      messagingSenderId: "346569056036",
      appId: "1:346569056036:web:259c34a2b71c93fe6cc2db"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();
    
    const output = document.getElementById('output');
    const approveBtn = document.getElementById('approve');
    
    function log(msg) {
      output.textContent += msg + '\n';
    }
    
    auth.onAuthStateChanged(async (user) => {
      output.textContent = '';
      
      if (!user) {
        log('❌ NOT LOGGED IN');
        log('');
        log('Please log in first at:');
        log('https://society.psots.in/society/register.html');
        log('');
        log('Then come back to this page.');
        return;
      }
      
      log('✓ Logged in as: ' + user.email);
      log('✓ Firebase UID: ' + user.uid);
      log('');
      log('Fetching resident document...');
      log('');
      
      try {
        const snap = await db.collection('residents').where('email', '==', user.email).get();
        
        if (snap.empty) {
          log('❌ NO RESIDENT DOCUMENT FOUND!');
          log('');
          log('This means you have NOT completed registration.');
          log('Please go to: https://society.psots.in/society/register.html');
          return;
        }
        
        const doc = snap.docs[0];
        const data = doc.data();
        
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        log('📋 RESIDENT DOCUMENT FOUND');
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        log('');
        log('Document ID:      ' + doc.id);
        log('Name:             ' + (data.name || '(none)'));
        log('Email:            ' + (data.email || '(none)'));
        log('Flat Number:      ' + (data.flatNumber || '(none)'));
        log('Telegram:         ' + (data.telegramUsername || '(none)'));
        log('');
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        log('⚠️  CURRENT STATUS:  "' + (data.status || 'undefined') + '"');
        log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
        log('');
        log('Is Active:        ' + (data.isActive || false));
        log('Approved At:      ' + (data.approvedAt || '(null)'));
        log('Approved By:      ' + (data.approvedBy || '(null)'));
        log('');
        
        if (data.status === 'approved') {
          log('✅ STATUS IS ALREADY "approved"');
          log('');
          log('You should be able to post!');
          log('');
          log('If you still see "pending approval" error:');
          log('1. Hard refresh the page (Cmd+Shift+R or Ctrl+Shift+R)');
          log('2. Clear browser cache');
          log('3. Try incognito/private window');
          log('4. Check browser console for JavaScript errors');
        } else {
          log('❌ STATUS IS NOT "approved" ← THIS IS THE PROBLEM!');
          log('');
          log('Expected: "approved"');
          log('Actual:   "' + (data.status || 'undefined') + '"');
          log('');
          log('Click the button below to fix it:');
          
          approveBtn.style.display = 'block';
          let docRef = doc.ref;
          
          approveBtn.onclick = async () => {
            approveBtn.disabled = true;
            approveBtn.textContent = '⏳ Updating...';
            
            try {
              await docRef.update({
                status: 'approved',
                approvedAt: firebase.firestore.FieldValue.serverTimestamp(),
                approvedBy: 'self (superadmin)',
                isActive: true
              });
              
              log('');
              log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
              log('✅ SUCCESS! STATUS UPDATED TO "approved"');
              log('━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━');
              log('');
              log('Now go to:');
              log('• https://society.psots.in/society/lostandfound');
              log('• https://society.psots.in/society/carpooling');
              log('');
              log('And refresh the page (Cmd+R or Ctrl+R)');
              log('');
              log('You should now see the posting form!');
              
              approveBtn.textContent = '✅ DONE!';
              approveBtn.style.background = '#00ffff';
            } catch (err) {
              log('');
              log('❌ ERROR UPDATING: ' + err.message);
              approveBtn.disabled = false;
              approveBtn.textContent = '❌ Failed - Try Again';
            }
          };
        }
        
      } catch (err) {
        log('❌ ERROR: ' + err.message);
        log('');
        log('Stack trace:');
        log(err.stack);
      }
    });
  </script>
</body>
</html>
